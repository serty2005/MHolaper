<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лог-файлы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Лог-файлы приложения</h1>
    <ul>
        {% for log_file in log_files %}
        <li>
            <a href="{{ url_for('download_log', filename=log_file) }}">{{ log_file }}</a>
        </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('index') }}">Вернуться на главную</a>
</body>
</html>
